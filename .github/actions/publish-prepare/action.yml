name: Publish preparation

description: Common setup steps for publishing packages (after checkout)

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '22.22.3'
        # https://github.com/actions/setup-node/blob/main/docs/advanced-usage.md#caching-packages-dependencies
        cache: 'pnpm'
        package-manager-cache: false
        # `registry-url` is deliberately omitted. Setting it makes setup-node
        # write an .npmrc containing `_authToken=${NODE_AUTH_TOKEN}` and, with no
        # token supplied, export the placeholder `XXXXX-XXXXX-XXXXX-XXXXX`. npm
        # then authenticates with that instead of exchanging the Actions OIDC
        # token, and the registry answers `E404 Not Found - PUT` rather than 403.
        # Publishing here relies on npm trusted publishing, so npm must find no
        # credentials at all. registry.npmjs.org is already the default registry.
    # Ensure npm 11.5.1 or later is installed
    - name: Update npm
      shell: bash
      run: npm install -g npm@latest
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Build packages
      shell: bash
      run: pnpm run release:build
