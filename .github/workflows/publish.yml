name: Publish packages

# A single workflow handles both canary and stable publishing: npm trusted
# publishing is configured against one workflow file per package.
#
# Authentication is OIDC trusted publishing — there is no npm token. The
# package must already exist on npm with a trusted publisher pointing at
# `fairgarden/docs` and this workflow file, otherwise `npm publish` fails
# with an auth error. Bootstrap a brand new package by publishing it once
# from a workstation, then configure trusted publishing on npmjs.com.

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:
    inputs:
      dist-tag:
        description: 'npm dist tag to publish the release to'
        required: false
        type: string
        default: 'latest'
      dry-run:
        description: 'Pack and validate without publishing'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canary:
    name: Publish canary
    # Renovate lock bumps do not warrant a canary.
    if: >
      github.event_name == 'schedule'
      || (github.event_name == 'push' && github.event.head_commit.author.name != 'renovate[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for provenance and trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Prepare for publishing
        uses: ./.github/actions/publish-prepare

      - name: Has this commit already been published?
        id: published
        run: |
          # Each canary records the commit it was built from, so a nightly run
          # with no new commits is a no-op instead of a version bump.
          previous="$(npm view @fairgarden/docs@canary gitSha 2>/dev/null || true)"
          if [ "$previous" = "$GITHUB_SHA" ]; then
            echo "Canary for $GITHUB_SHA already published; nothing to do."
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp the canary version
        if: steps.published.outputs.skip == 'false'
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node --input-type=module -e '
            import { readFile, writeFile } from "node:fs/promises";

            const manifestPath = "packages/docs/build/package.json";
            const manifest = JSON.parse(await readFile(manifestPath, "utf8"));
            // Canaries lead the next patch so they sort above the current
            // release and below the release they are previewing.
            const [major, minor, patch] = manifest.version.split("-")[0].split(".").map(Number);
            const version = `${major}.${minor}.${patch + 1}-canary.${process.env.RUN_NUMBER}`;

            manifest.version = version;
            manifest.gitSha = process.env.GITHUB_SHA;
            await writeFile(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);

            await writeFile(process.env.GITHUB_OUTPUT, `version=${version}\n`, { flag: "a" });
            console.log(`@fairgarden/docs@${version}`);
          '

      - name: Publish to npm
        if: steps.published.outputs.skip == 'false'
        working-directory: packages/docs/build
        run: npm publish --tag canary --provenance

      - name: Summary
        if: steps.published.outputs.skip == 'false'
        run: |
          echo "Published \`@fairgarden/docs@${{ steps.version.outputs.version }}\` to the \`canary\` tag." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for pushing the tag and creating the release
      id-token: write # Required for provenance and trusted publishing
    environment:
      name: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # `gh release create --generate-notes` needs history
      - name: Prepare for publishing
        uses: ./.github/actions/publish-prepare

      - name: Resolve version
        id: version
        run: |
          version="$(node -p 'require("./packages/docs/package.json").version')"
          echo "Releasing @fairgarden/docs@${version}"

          if [ -n "$(npm view "@fairgarden/docs@${version}" version 2>/dev/null || true)" ]; then
            echo "::error::@fairgarden/docs@${version} is already on npm. Bump the version in packages/docs/package.json first."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        working-directory: packages/docs/build
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            npm publish --tag "${{ inputs.dist-tag }}" --provenance --dry-run
          else
            npm publish --tag "${{ inputs.dist-tag }}" --provenance
          fi

      - name: Tag and create the GitHub release
        if: inputs.dry-run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag

      - name: Summary
        run: |
          echo "Published \`@fairgarden/docs@${{ steps.version.outputs.version }}\` to the \`${{ inputs.dist-tag }}\` tag." >> "$GITHUB_STEP_SUMMARY"
