name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install left the working tree dirty?
        run: git add -A && git diff --exit-code --staged
      - name: '`pnpm dedupe` was run?'
        run: pnpm dedupe --check
      - name: '`pnpm prettier` changes committed?'
        run: pnpm prettier:check
      - name: Build @fairgarden/docs
        # `eslint.config.mjs` imports `lintJavascriptDemoFocus` from the package
        # by name, which resolves to its build output — ESLint cannot load its
        # own config until the library has been built.
        run: pnpm docs:lib
      - name: Restore ESLint cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .eslintcache
          key: eslint-cache-${{ hashFiles('pnpm-lock.yaml') }}
      - name: ESLint
        # Without a warm cache ESLint can go a long time before producing output.
        timeout-minutes: 15
        run: pnpm run eslint:ci --cache --cache-strategy content
      - name: Stylelint
        run: pnpm stylelint
      - name: TypeScript
        run: pnpm typescript

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run tests
        run: pnpm test --run

  build:
    name: Build packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build packages
        run: pnpm release:build

  docs:
    name: Docs build and validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build @fairgarden/docs
        run: pnpm docs:lib
      - name: Validate the documentation files
        run: pnpm docs:validate
      - name: Cache Next.js build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          # Next keeps its build cache in `.next/cache` even though `distDir`
          # sends the build output to `export/`.
          path: docs/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('docs/**/*.[jt]s', 'docs/**/*.[jt]sx', 'docs/**/*.json', 'docs/**/*.md', 'docs/**/*.mdx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-
      - name: Build docs
        run: pnpm docs:build
      - name: Check for broken links
        run: pnpm -F "./docs" run link-check

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The image tag must track the `playwright` / `@playwright/test` versions in
    # the root package.json, or the bundled browsers won't match the client
    # driving them. `--ipc=host` keeps Chromium from OOM-ing on shared memory.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    env:
      # The job runs as root but the image's default `$HOME` (/github/home) is
      # owned by `pwuser`. Firefox refuses to launch in that state, and git
      # rejects the workspace as dubiously owned. Pointing HOME at a directory
      # root owns fixes both, and lets checkout register `safe.directory` in a
      # gitconfig later steps actually read.
      HOME: /root
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run browser tests
        # `:unconfined` skips the container-engine wrapper `pnpm test:browser`
        # uses locally — we are already inside the Playwright image.
        run: pnpm test:browser:unconfined

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    env:
      # See the `browser` job — same root/HOME ownership problem.
      HOME: /root
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Let git read the workspace
        # The job runs as root while the workspace is owned by the runner user,
        # so git rejects it as dubiously owned. `actions/checkout` does register
        # it as a safe directory, but only after pointing HOME at a temp dir it
        # then discards, so that entry never reaches later steps. `next build`
        # shells out to git to resolve `SOURCE_CODE_ROOT_URL` and silently
        # produces an empty value when those calls fail, which breaks the
        # prerender of demos that link back to the source tree.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup
      - name: Build @fairgarden/docs
        run: pnpm docs:lib
      - name: Run end-to-end tests
        # Playwright's `webServer` builds and serves the docs export itself.
        run: pnpm -F "./docs" run test:e2e:unconfined
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report
          path: docs/playwright-report/
          retention-days: 7
